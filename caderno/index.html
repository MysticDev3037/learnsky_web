<!DOCTYPE html>
<html lang="pt-br">
    <!-- Conteudo vizualizado pela maquina --> 
    <head>
        <!-- Descreve os atributos adicionados de metadados --> 
        <meta charset="UTF-8">
        <title>LearnSky</title>
        <!-- Conexão entre arquivos-->
        <link rel="stylesheet" href="estilo.css">
        <!--executar JavaScript, usamos "src" para buscar arquivo externo-->
        <script src="script.js" defer></script>
        <!--Adaptar a qualquer tamanho de tela-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <!--Tag para conteúdo para o usuario final-->
    
    <body>
        <!-- Cabeçalho principal -->
        <header>
            <h1>LearnSky</h1>
        </header>

        <!-- Conteúdo principal da página -->
        <main>
            <section id="inicio">
                <h2>Organize seus estudos</h2>
                <p>Seu conhecimento, conectado em um só lugar.</p>

                <button id="criar-ambiente">
                    + Criar ambiente
                </button>
            </section>

            <!-- Área onde os ambientes serão exibidos -->
            <section id="ambientes">
                <h2>Meus ambientes</h2>

                <p id="mensagem-vazia">
                    Você ainda não criou nenhum ambiente.
                </p>

                <div id="lista-ambientes"></div>
            </section>


            <!-- Area Dentro do Ambiente==================-->
            <section id="tela-ambiente" hidden>
                <button id="voltar-inicio">← Voltar</button>

                <h2 id="titulo-ambiente"></h2>

                <p id="descricao-ambiente-aberto"></p>
                <button id="criar-caderno">+ Criar caderno</button>

                <div id="lista-cadernos">
                    <p>Nenhum caderno criado ainda.</p>
                </div>
            </section>
            <dialog id="modal-caderno">
                <h2>Criar caderno</h2>

                <form id="form-caderno">
                    <label for="nome-caderno">Nome do caderno</label>
                    <input
                        type="text"
                        id="nome-caderno"
                        placeholder="Ex.: Banco de Dados"
                        required
                    >

                    <label for="descricao-caderno">Descrição (opcional)</label>
                    <textarea
                        id="descricao-caderno"
                        placeholder="Sobre o que é este caderno?"
                    ></textarea>

                    <div class="acoes-modal">
                        <button type="button" id="cancelar-caderno">
                            Cancelar
                        </button>

                        <button type="submit">Criar caderno</button>
                    </div>
                </form>
            </dialog>

            <!-- Tela dentro do caderno===============================-->
            <section id="tela-caderno" hidden>
                <button id="voltar-ambiente">← Voltar aos ambientes</button>

                <h2 id="titulo-caderno"></h2>

                <p id="descricao-caderno-aberto"></p>

                <button type="button" id="criar-pagina">+ Criar página</button>

                <div id="lista-paginas">
                    <p>Nenhuma página criada ainda.</p>
                </div>
            </section>


            <!-- Tela de paginas===================================-->
            <dialog id="modal-pagina">
                <h2>Criar página</h2>

                <form id="form-pagina">
                    <label for="titulo-pagina">Título da página</label>
                    <input
                        type="text"
                        id="titulo-pagina"
                        placeholder="Ex.: Introdução ao SQL"
                        required
                    >

                    <div class="acoes-modal">
                        <button type="button" id="cancelar-pagina">
                            Cancelar
                        </button>

                        <button type="submit">Criar página</button>
                    </div>
                </form>
            </dialog>
        </main>


<!-- Janela para criar um ambiente ==========================================-->
        <dialog id="modal-ambiente">
            <h2>Criar ambiente</h2>

            <form id="form-ambiente">
                <label for="nome-ambiente">Nome do ambiente</label>
                <input
                    type="text"
                    id="nome-ambiente"
                    placeholder="Ex.: Faculdade"
                    required
                >

                <label for="descricao-ambiente">Descrição (opcional)</label>
                <textarea
                    id="descricao-ambiente"
                    placeholder="Sobre o que é este ambiente?"
                ></textarea>

                <div class="acoes-modal">
                    <button type="button" id="cancelar-ambiente">
                        Cancelar
                    </button>

                    <button type="submit">
                        Criar ambiente
                    </button>
                </div>
            </form>
        </dialog>
<!--==========================================================-->
    </body>
</html>
